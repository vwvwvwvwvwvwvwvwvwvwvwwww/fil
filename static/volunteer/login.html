<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход волонтёра — ГАПОУ ОКЭИ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ["Fraunces", "Georgia", "serif"],
            sans: ["Source Sans 3", "system-ui", "sans-serif"],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="/static/css/theme.css" />
  <script src="/static/js/form-validators.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#f0f7ff] via-white to-blue-50/30 font-sans">
  <header class="site-header sticky top-0 z-30 border-b border-blue-100 bg-white/90 backdrop-blur pt-[env(safe-area-inset-top)]">
    <div class="max-w-6xl mx-auto px-3 sm:px-4 py-3 sm:py-4">
      <div class="flex flex-col gap-2.5 sm:flex-row sm:items-center sm:justify-between sm:gap-3">
      <a href="/index.html" class="flex min-w-0 shrink-0 items-center gap-2.5 sm:gap-3">
        <img src="/static/img/oksei/logo.png" alt="" width="40" height="40" class="h-10 w-10 rounded-2xl bg-white object-contain ring-1 ring-slate-200" />
        <span class="font-display text-sm font-semibold text-slate-900">ГАПОУ ОКЭИ · волонтёр</span>
      </a>
      <nav class="flex w-full flex-col gap-2 text-sm sm:w-auto sm:flex-row sm:items-center sm:justify-end sm:gap-3">
        <a href="/index.html" class="inline-flex min-h-11 touch-manipulation items-center justify-center rounded-xl border border-slate-200 bg-white px-4 font-medium text-slate-700 hover:border-blue-200 hover:bg-blue-50/60 hover:text-blue-800">На главную</a>
        <a href="/admin/login.html" class="inline-flex min-h-11 touch-manipulation items-center justify-center rounded-xl border border-indigo-200 bg-indigo-50 px-4 font-semibold text-indigo-900 hover:bg-indigo-100">Вход для сотрудников</a>
      </nav>
    </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-3 sm:px-4 py-8 sm:py-10 md:py-14">
    <p class="text-xs font-semibold uppercase tracking-wide text-blue-700">Личный кабинет участника</p>
    <h1 class="font-display mt-2 text-2xl font-semibold text-slate-900 sm:text-3xl md:text-4xl">Вход для волонтёров</h1>
    <p class="mt-3 max-w-2xl text-slate-600">Вход по email и паролю или первый вход — задание пароля (справа).</p>

    <div class="mt-10 grid gap-6 sm:gap-8 lg:grid-cols-2">
      <section class="rounded-3xl border border-blue-100 bg-white p-5 shadow-xl shadow-blue-900/5 ring-1 ring-slate-900/5 sm:p-8">
        <h2 class="font-display text-xl font-semibold text-slate-900">Вход</h2>
        <p class="mt-2 text-sm text-slate-600">Email и пароль.</p>
        <form id="login-form" class="mt-6 space-y-4" novalidate>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1" for="l-email">Email</label>
            <input id="l-email" name="email" type="email" required maxlength="254" autocomplete="username"
              class="w-full rounded-xl border border-slate-200 px-3 py-2.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20" />
            <p id="err-l-email" class="mt-1 text-xs text-red-600 hidden" role="alert"></p>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1" for="l-pass">Пароль</label>
            <input id="l-pass" name="password" type="password" required minlength="4" autocomplete="current-password"
              class="w-full rounded-xl border border-slate-200 px-3 py-2.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20" />
            <p id="err-l-pass" class="mt-1 text-xs text-red-600 hidden" role="alert"></p>
          </div>
          <p id="login-msg" class="text-sm hidden"></p>
          <button type="submit" id="login-btn" class="w-full rounded-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-3 font-semibold disabled:opacity-60">
            Войти
          </button>
        </form>
      </section>

      <section class="rounded-3xl border border-slate-200 bg-slate-50/80 p-5 ring-1 ring-slate-900/5 sm:p-8">
        <h2 class="font-display text-xl font-semibold text-slate-900">Первый вход</h2>
        <p class="mt-2 text-sm text-slate-600">Если заявку одобрили, задайте пароль (не короче 6 символов).</p>
        <form id="activate-form" class="mt-6 space-y-4" novalidate>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1" for="a-email">Email</label>
            <input id="a-email" type="email" required maxlength="254" autocomplete="email"
              class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20" />
            <p id="err-a-email" class="mt-1 text-xs text-red-600 hidden" role="alert"></p>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1" for="a-pass">Новый пароль</label>
            <input id="a-pass" type="password" required minlength="6" autocomplete="new-password"
              class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20" />
            <p id="err-a-pass" class="mt-1 text-xs text-red-600 hidden" role="alert"></p>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1" for="a-pass2">Повтор пароля</label>
            <input id="a-pass2" type="password" required minlength="6" autocomplete="new-password"
              class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20" />
            <p id="err-a-pass2" class="mt-1 text-xs text-red-600 hidden" role="alert"></p>
          </div>
          <p id="act-msg" class="text-sm text-red-600 hidden"></p>
          <button type="submit" id="act-btn" class="w-full rounded-full bg-slate-800 hover:bg-slate-900 text-white px-4 py-3 font-semibold disabled:opacity-60">
            Сохранить пароль и войти
          </button>
        </form>
      </section>
    </div>
  </main>

  <script src="/static/js/volunteer-auth.js"></script>
  <script>
    function safeReturnPath(raw) {
      if (!raw || typeof raw !== "string") return "/volunteer/account.html";
      const path = raw.trim();
      if (!path.startsWith("/") || path.startsWith("//")) return "/volunteer/account.html";
      return path;
    }

    const returnAfterLogin = safeReturnPath(new URLSearchParams(location.search).get("next"));

    /** Адреса почты учётных записей сотрудников — на этой странице для них вход не предусмотрен. */
    var STAFF_LOGIN_EMAILS = new Set([
      "advisor@example.com",
      "e.semikina@vup-oksei.example.org",
      "y.zhiganova@vup-oksei.example.org",
      "k.kustomova@vup-oksei.example.org",
    ]);

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("login-btn");
      const msg = document.getElementById("login-msg");
      msg.classList.add("hidden");
      const email = document.getElementById("l-email").value;
      const password = document.getElementById("l-pass").value;
      const errEmail = document.getElementById("err-l-email");
      const errPass = document.getElementById("err-l-pass");
      if (!window.FormValidators.validateLogin(email, password, errEmail, errPass, document.getElementById("l-email"), document.getElementById("l-pass"))) return;

      var emailNorm = String(email).trim().toLowerCase();
      if (STAFF_LOGIN_EMAILS.has(emailNorm)) {
        msg.textContent =
          "Для этого адреса предусмотрен вход сотрудников отдела. Нажмите «Сотрудникам» в шапке страницы.";
        msg.classList.remove("text-red-600");
        msg.classList.add("text-amber-900");
        msg.classList.remove("hidden");
        return;
      }

      btn.disabled = true;
      try {
        const res = await fetch("/api/volunteer/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.csrf) {
          sessionStorage.removeItem("csrf");
          volunteerAuth.saveCsrf(data.csrf);
          window.location.replace(returnAfterLogin);
          return;
        }
        msg.textContent = data.detail || "Неверный email или пароль";
        msg.classList.remove("text-amber-900", "text-red-600");
        msg.classList.add(res.status === 403 ? "text-amber-900" : "text-red-600");
        msg.classList.remove("hidden");
      } catch {
        msg.textContent = "Ошибка сети";
        msg.classList.remove("hidden");
      } finally {
        btn.disabled = false;
      }
    });

    function clearActivateErrs() {
      ["err-a-email", "err-a-pass", "err-a-pass2"].forEach((id) => {
        const el = document.getElementById(id);
        el.textContent = "";
        el.classList.add("hidden");
      });
      ["a-email", "a-pass", "a-pass2"].forEach((id) => {
        const inp = document.getElementById(id);
        inp.classList.remove("border-red-500", "ring-2", "ring-red-500/25");
        inp.removeAttribute("aria-invalid");
      });
    }

    document.getElementById("activate-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearActivateErrs();
      const btn = document.getElementById("act-btn");
      const msg = document.getElementById("act-msg");
      msg.classList.add("hidden");
      const email = document.getElementById("a-email").value.trim();
      const password = document.getElementById("a-pass").value;
      const password_confirm = document.getElementById("a-pass2").value;
      let ok = true;
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        window.FormValidators.showErr(document.getElementById("err-a-email"), "Укажите корректный email.", document.getElementById("a-email"));
        ok = false;
      }
      if (password.length < 6) {
        window.FormValidators.showErr(document.getElementById("err-a-pass"), "Пароль не короче 6 символов.", document.getElementById("a-pass"));
        ok = false;
      }
      if (password !== password_confirm) {
        window.FormValidators.showErr(document.getElementById("err-a-pass2"), "Пароли должны совпадать.", document.getElementById("a-pass2"));
        ok = false;
      }
      if (!ok) return;
      btn.disabled = true;
      try {
        const res = await fetch("/api/volunteer/activate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ email, password, password_confirm }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.csrf) {
          sessionStorage.removeItem("csrf");
          volunteerAuth.saveCsrf(data.csrf);
          window.location.replace(returnAfterLogin);
          return;
        }
        msg.textContent = typeof data.detail === "string" ? data.detail : "Не удалось сохранить пароль";
        msg.classList.remove("hidden");
      } catch {
        msg.textContent = "Ошибка сети";
        msg.classList.remove("hidden");
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
