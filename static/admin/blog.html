<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Блог</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <script src="/static/js/admin-auth.js"></script>
  <script src="/static/js/admin-staff-nav.js"></script>
  <script src="/static/js/admin-modal.js"></script>
  <script src="/static/js/form-validators.js"></script>
  <style>
    body { font-family: Inter, system-ui, sans-serif; }
    #preview { white-space: pre-wrap; }
  </style>
</head>
<body class="bg-[#F0F7FF] min-h-screen" data-staff-page="content">
  <header class="site-header sticky top-0 z-30 border-b border-blue-100 bg-white pt-[env(safe-area-inset-top)]">
    <div class="max-w-6xl mx-auto px-3 sm:px-4 py-3 sm:py-4">
      <div class="flex flex-col gap-3 sm:flex-row sm:flex-wrap sm:items-center sm:justify-between">
      <a href="../index.html" class="flex min-w-0 items-center gap-2.5 sm:gap-3 shrink-0 rounded-lg pr-1 hover:opacity-90 transition">
        <img src="/static/img/oksei/logo.png" alt="Логотип ГАПОУ ОКЭИ" width="36" height="36" class="h-9 w-9 rounded-xl bg-white object-contain ring-1 ring-slate-200" />
        <span class="min-w-0 leading-tight">
          <span class="font-display block font-semibold text-slate-900">ГАПОУ ОКЭИ</span>
          <span class="text-xs text-slate-500">восп. отдел</span>
        </span>
      </a>
      <nav class="site-nav-scroll flex w-full min-w-0 flex-nowrap items-center gap-1 overflow-x-auto overscroll-x-contain text-sm sm:w-auto sm:flex-wrap sm:overflow-visible sm:gap-3">
        <a href="/admin/dashboard.html" class="text-gray-600 hover:text-blue-600">Статистика</a>
        <a href="/admin/applications.html" data-staff-nav="applications" class="text-gray-600 hover:text-blue-600">Заявки</a>
        <a href="/admin/volunteers.html" data-staff-nav="volunteers" class="text-gray-600 hover:text-blue-600">Волонтёры</a>
        <a href="/admin/events.html" data-staff-nav="content" class="text-gray-600 hover:text-blue-600">Мероприятия</a>
        <a href="/admin/blog.html" data-staff-nav="content" class="font-medium text-blue-700">Блог</a>
        <button type="button" id="logout" class="text-red-600">Выйти</button>
      </nav>
    </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-3 sm:px-4 py-6 sm:py-8 space-y-8">
    <section class="bg-white border border-blue-100 shadow-sm rounded-xl p-6">
      <h2 id="form-heading" class="text-lg font-semibold">Новая публикация</h2>
      <p id="edit-banner" class="hidden mt-2 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-sm text-amber-950">
        Вы редактируете существующую запись. После сохранения режим «новая публикация» включится снова.
      </p>
      <form id="form" class="mt-4 space-y-4" novalidate>
        <div>
          <label class="block text-sm text-gray-600 mb-1">Заголовок</label>
          <input name="title" required class="w-full rounded-lg border border-gray-200 px-3 py-2" />
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">Текст</label>
          <textarea name="content" id="content" rows="8" required class="w-full rounded-lg border border-gray-200 px-3 py-2 font-mono text-sm"></textarea>
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" name="is_visible" id="vis" checked class="rounded border-gray-300" />
          <label for="vis" class="text-sm text-gray-700">Видна на сайте</label>
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">Обложка (изображение)</label>
          <input type="file" id="file" accept="image/*" class="text-sm" />
        </div>
        <div class="flex gap-3 flex-wrap items-center">
          <button type="submit" id="submit-btn" class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-4 py-2 font-medium">
            Опубликовать
          </button>
          <button type="button" id="cancel-edit" class="hidden border border-gray-300 rounded-lg px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">
            Отменить редактирование
          </button>
          <button type="button" id="prev-btn" class="border border-blue-200 rounded-lg px-4 py-2 text-sm hover:bg-blue-50">
            Предпросмотр
          </button>
        </div>
      </form>
      <div id="preview-wrap" class="mt-6 hidden border border-dashed border-blue-200 rounded-xl p-4 bg-[#F9FCFF]">
        <p class="text-xs text-gray-500 mb-2">Предпросмотр</p>
        <h3 id="pv-title" class="text-xl font-semibold"></h3>
        <div id="preview" class="mt-2 text-gray-700"></div>
      </div>
    </section>

    <section>
      <h1 class="text-2xl font-bold mb-4">Все публикации</h1>
      <div id="list" class="space-y-3"></div>
      <p id="empty" class="text-gray-500 hidden py-6">Публикаций нет.</p>
    </section>
  </main>

  <p id="msg" class="max-w-6xl mx-auto px-4 text-sm hidden"></p>

  <script>
    document.getElementById("logout").addEventListener("click", async () => {
      await adminAuth.fetch("/api/admin/logout", { method: "POST" });
      sessionStorage.removeItem("csrf");
      if (adminAuth.invalidateMeCache) adminAuth.invalidateMeCache();
      window.location.href = "/admin/login.html";
    });

    document.getElementById("prev-btn").addEventListener("click", () => {
      document.getElementById("preview-wrap").classList.remove("hidden");
      document.getElementById("pv-title").textContent = document.querySelector('[name="title"]').value;
      document.getElementById("preview").textContent = document.getElementById("content").value;
    });

    let editingId = null;

    function enterEditMode(post) {
      editingId = post.id;
      document.querySelector('[name="title"]').value = post.title;
      document.getElementById("content").value = post.content;
      document.getElementById("vis").checked = !!post.is_visible;
      document.getElementById("file").value = "";
      document.getElementById("form-heading").textContent = "Редактирование публикации";
      document.getElementById("edit-banner").classList.remove("hidden");
      document.getElementById("cancel-edit").classList.remove("hidden");
      document.getElementById("submit-btn").textContent = "Сохранить изменения";
      document.getElementById("form").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function exitEditMode() {
      editingId = null;
      document.getElementById("form").reset();
      document.getElementById("vis").checked = true;
      document.getElementById("form-heading").textContent = "Новая публикация";
      document.getElementById("edit-banner").classList.add("hidden");
      document.getElementById("cancel-edit").classList.add("hidden");
      document.getElementById("submit-btn").textContent = "Опубликовать";
    }

    document.getElementById("cancel-edit").addEventListener("click", () => exitEditMode());

    function escHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/"/g, "&quot;");
    }

    async function loadPosts() {
      const res = await adminAuth.fetch("/api/admin/blog");
      if (!res.ok) return;
      const posts = await res.json();
      const list = document.getElementById("list");
      const empty = document.getElementById("empty");
      list.innerHTML = "";
      if (!posts.length) {
        empty.classList.remove("hidden");
        return;
      }
      empty.classList.add("hidden");
      posts.forEach((p) => {
        const div = document.createElement("div");
        div.className = "bg-white border border-blue-100 rounded-xl p-4 flex flex-wrap justify-between gap-3";
        div.innerHTML = `
          <div class="min-w-0 flex-1">
            <p class="font-medium">${escHtml(p.title)}</p>
            <p class="text-xs text-gray-500 mt-1">${new Date(p.published_at).toLocaleString("ru-RU")} · ${p.is_visible ? "видна" : "скрыта"}</p>
            <p class="text-sm text-gray-600 mt-2 line-clamp-2">${escHtml(p.content.slice(0, 160))}…</p>
          </div>
          <div class="flex flex-col gap-2 items-end shrink-0">
            <button type="button" data-id="${p.id}" class="edit rounded-lg border border-blue-200 bg-white px-3 py-1.5 text-sm font-medium text-blue-700 hover:bg-blue-50">Редактировать</button>
            <button type="button" data-id="${p.id}" class="del text-sm text-red-600 hover:underline">Удалить</button>
          </div>
        `;
        list.appendChild(div);
      });
      list.querySelectorAll(".edit").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = Number(btn.getAttribute("data-id"));
          const post = posts.find((x) => x.id === id);
          if (post) enterEditMode(post);
        });
      });
      list.querySelectorAll(".del").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!(await adminModal.confirm("Удалить публикацию?"))) return;
          const id = btn.getAttribute("data-id");
          const res = await adminAuth.fetch(`/api/admin/blog/${id}`, { method: "DELETE" });
          if (res.ok || res.status === 204) {
            if (editingId === Number(id)) exitEditMode();
            loadPosts();
          } else await adminModal.alert(await adminAuth.parseError(res), { type: "error" });
        });
      });
    }

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      const btn = document.getElementById("submit-btn");
      msg.classList.add("hidden");
      const title = document.querySelector('[name="title"]').value;
      const content = document.getElementById("content").value;
      const blogErr = window.FormValidators.validateBlogCreate(title, content);
      if (blogErr) {
        await adminModal.alert(blogErr, { type: "error", title: "Проверьте форму" });
        return;
      }
      btn.disabled = true;
      btn.textContent = "Сохранение…";
      try {
        let image_url = null;
        const fileEl = document.getElementById("file");
        if (fileEl.files && fileEl.files[0]) {
          const fd = new FormData();
          fd.append("file", fileEl.files[0]);
          const up = await adminAuth.fetch("/api/admin/upload", { method: "POST", body: fd });
          if (!up.ok) throw new Error(await adminAuth.parseError(up));
          const u = await up.json();
          image_url = u.url;
        }
        const is_visible = document.getElementById("vis").checked;

        if (editingId) {
          const body = { title, content, is_visible };
          if (image_url != null) body.image_url = image_url;
          const res = await adminAuth.fetch(`/api/admin/blog/${editingId}`, {
            method: "PUT",
            body: JSON.stringify(body),
          });
          if (!res.ok) throw new Error(await adminAuth.parseError(res));
          exitEditMode();
          await loadPosts();
          await adminModal.alert("Изменения сохранены.", { title: "Публикация обновлена" });
        } else {
          const res = await adminAuth.fetch("/api/admin/blog", {
            method: "POST",
            body: JSON.stringify({ title, content, is_visible, image_url }),
          });
          if (!res.ok) throw new Error(await adminAuth.parseError(res));
          e.target.reset();
          document.getElementById("file").value = "";
          await loadPosts();
          await adminModal.alert("Материал опубликован на сайте.", { title: "Публикация создана" });
        }
      } catch (err) {
        if (err.message !== "unauthorized") {
          await adminModal.alert(err.message, { type: "error" });
        }
      } finally {
        btn.disabled = false;
        btn.textContent = editingId ? "Сохранить изменения" : "Опубликовать";
      }
    });

    loadPosts();
  </script>
</body>
</html>
